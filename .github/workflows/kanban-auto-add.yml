name: Kanban Auto Add

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read
  repository-projects: write

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue or PR to project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ vars.KANBAN_PROJECT_URL }}
          github-token: ${{ secrets.KANBAN_PROJECT_TOKEN }}
